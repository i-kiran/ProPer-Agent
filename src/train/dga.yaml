# Dimension Generating Agent -- LLaMA-Factory SFT config.
#
# One checkpoint, both heads: the training file interleaves `user` rows
# (query -> user_aspects) and `system` rows (query + gold response ->
# solution_aspects). See src/data/build_dga.py.
#
# cutoff_len is larger than the RGA's: dimension targets are long JSON arrays.
#
#   llamafactory-cli train src/train/dga.yaml dataset=dga_pwab

### model
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target: all

### dataset
dataset: dga_code
dataset_dir: data/release
template: llama3
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/code/dga
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
